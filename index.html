<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F3E8CE" />
    <script>
      try {
        const savedTheme = localStorage.getItem('sukkot-color-theme')
        document.documentElement.dataset.theme = savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : 'light'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <title>Sukkot Camp Leaderboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
